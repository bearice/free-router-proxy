apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "free-router.fullname" . }}
  labels:
    {{- include "free-router.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "free-router.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "free-router.selectorLabels" . | nindent 8 }}
    spec:
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "free-router.fullname" . }}-data
          {{- else }}
          emptyDir: {}
          {{- end }}
      containers:
        - name: free-router
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.persistence.mountPath | quote }}
          {{- with .Values.envFromSecret }}
          envFrom:
            - secretRef:
                name: {{ . | quote }}
          {{- end }}
          env:
            - name: FREE_ROUTER_CONFIG
              value: {{ .Values.persistence.configPath | quote }}
            - name: FREE_ROUTER_HOST
              value: {{ .Values.host | quote }}
            - name: FREE_ROUTER_PORT
              value: {{ .Values.port | quote }}
            - name: FREE_ROUTER_ALLOW_REMOTE_UI
              value: {{ ternary "true" "false" .Values.allowRemoteUI | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.port }}
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
