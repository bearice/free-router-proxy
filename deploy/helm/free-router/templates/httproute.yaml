{{- if .Values.httpRoute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "free-router.fullname" . }}
  labels:
    {{- include "free-router.labels" . | nindent 4 }}
  {{- with .Values.httpRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  hostnames:
    {{- toYaml (required "httpRoute.hostnames is required when httpRoute.enabled is true" .Values.httpRoute.hostnames) | nindent 4 }}
  parentRefs:
    {{- toYaml (required "httpRoute.parentRefs is required when httpRoute.enabled is true" .Values.httpRoute.parentRefs) | nindent 4 }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "free-router.fullname" . }}
          port: {{ .Values.service.port }}
{{- end }}
