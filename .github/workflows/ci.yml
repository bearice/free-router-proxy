name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Node.js metadata
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Check JavaScript
        run: npm run check

      - name: Run smoke tests
        run: npm test

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint Helm chart
        run: helm lint deploy/helm/free-router

      - name: Render Helm chart without a route
        run: helm template free-router deploy/helm/free-router

      - name: Render Helm chart with Gateway API values
        run: >-
          helm template free-router deploy/helm/free-router
          --set httpRoute.enabled=true
          --set-json 'httpRoute.hostnames=["example.invalid"]'
          --set-json 'httpRoute.parentRefs=[{"name":"gateway","namespace":"default"}]'
